name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  QT_VERSION: "6.8.3"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qt_arch: linux_gcc_64
          - os: windows-2022
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libgl1-mesa-dev \
            libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --parallel
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildOutput = & cmake --build build --parallel 2>&1
          $buildExitCode = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Output $_ }
          if ($buildExitCode -ne 0) {
            $diagnostic = (($buildOutput | Select-Object -Last 80) -join "`n")
            $diagnostic = $diagnostic.Replace('%', '%25')
            $diagnostic = $diagnostic.Replace("`r", '')
            $diagnostic = $diagnostic.Replace("`n", '%0A')
            Write-Output "::error title=Windows build failed::$diagnostic"
            exit $buildExitCode
          }
      - name: Test
        run: ctest --test-dir build --output-on-failure
